<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<title>Detalhes do Evento</title>
</head>
<body>

	<div th:replace="~{menu :: menu}"></div>

	<div class="container">
		<h1>Detalhes do Evento</h1>

		<div class="card">
			<div class="card-content">
				<span class="card-title" th:text="${evento.nome}">Nome do Evento</span>
				<p><strong>Local: </strong><span th:text="${evento.local}">Local</span></p>
				<p><strong>Data: </strong><span th:text="${evento.data}">Data</span></p>
				<p><strong>Horário: </strong><span th:text="${evento.horario}">Horário</span></p>
			</div>
		</div>

		<!-- Formulário de Adição/Edição de Convidado -->
		<div class="card">
			<div class="card-content">
				<span class="card-title">Adicionar Convidado</span>
				<form th:action="@{/eventos/{idEvento}(idEvento=${evento.id})}" method="post" th:object="${convidado}">
					<input type="hidden" th:field="*{id}">
					
					<div>
						<label>Nome:</label> 
						<input type="text" th:field="*{nome}">
						<p th:errors="*{nome}" class="red-text"></p>
					</div>
					<div>
						<label>RG:</label> 
						<input type="text" th:field="*{rg}">
						<p th:errors="*{rg}" class="red-text"></p>
					</div>
					<button class="waves-effect waves-light btn" type="submit">Salvar Convidado</button>
				</form>
			</div>
		</div>

		<!-- Tabela de Convidados -->
		<h3>Convidados Cadastrados</h3>
		<table class="highlight">
			<thead>
				<tr>
					<th>Nome</th>
					<th>RG</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="c : ${convidados}">
					<td th:text="${c.nome}">Nome</td>
					<td th:text="${c.rg}">RG</td>
					<td>
						<a th:href="@{/eventos/{idEvento}/convidado/{idConvidado}/selecionar(idEvento=${evento.id}, idConvidado=${c.id})}">
							<i class="material-icons">edit</i>
						</a>
						<a th:href="@{/eventos/{idEvento}/convidados/{idConvidado}/remover(idEvento=${evento.id}, idConvidado=${c.id})}">
							<i class="material-icons">delete</i>
						</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</body>
</html>
