<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Eventos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
</head>
<body>

    <div th:replace="~{menu :: menu}"></div>

    <div class="container">
        <h1>Lista de Eventos</h1>
        
        
       <table class="striped">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Local</th>
            <th>Data</th>
            <th>Horário</th>
        </tr>
    </thead>
    <tbody>
        <!-- O th:each deve ficar exatamente assim na tag tr -->
        <tr th:each="e : ${eventos}">
            <td th:text="${e.id}">1</td>
            <td th:text="${e.nome}">Nome do evento</td>
            <td th:text="${e.local}">Local do evento</td>
            <td th:text="${e.data}">Data</td>
            <td th:text="${e.horario}">Horário</td>
        </tr>
    </tbody>
</table>
    </div>

</body>
</html>
